name: 재고 대시보드 갱신

on:
  push:
    paths:
      - scrape.js
      - .github/workflows/update-dashboard.yml
  schedule:
    # 매일 00:00 UTC = 한국시간 오전 9시 (평일만: 월~금)
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 이지어드민 데이터 수집 및 대시보드 생성
        env:
          EZ_DOMAIN: ${{ secrets.EZ_DOMAIN }}
          EZ_ID: ${{ secrets.EZ_ID }}
          EZ_PW: ${{ secrets.EZ_PW }}
        run: node scrape.js

      - name: 실패 시 진단 화면 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ezadmin-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 변경사항 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html data.json summary.png
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "재고 대시보드 자동 갱신"
            # 대시보드에서 발주처(suppliers.json)를 저장했을 수 있으니 최신을 받아 이어붙인 뒤 push
            git pull --rebase origin main
            git push
          fi

      - name: 카카오톡 알림
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: node kakao_notify.js
